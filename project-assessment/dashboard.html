<head>

<title>SSSF Project Assessment</title>
<style>
  :root {
    --bg: #0b0e17;
    --surface: #121624;
    --panel: #1a2032;
    --border: #2a3149;
    --text: #e6e9f2;
    --dim: #9aa3bd;
    --faint: #5d6682;
    --cyan: #5ad2dd;
    --amber: #e8b64a;
    --red: #ff6f67;
    --green: #4ade80;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 28px clamp(16px, 4vw, 48px) 64px;
    max-width: 1180px;
    margin: 0 auto;
  }
  a { color: var(--cyan); }
  header { margin-bottom: 28px; }
  h1 {
    font-size: 26px;
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  h1 .accent { color: var(--cyan); }
  .meta {
    color: var(--faint);
    font-size: 13px;
    font-family: var(--mono);
    margin-bottom: 14px;
  }
  .summary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--cyan);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--dim);
    max-width: 74ch;
  }
  h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--faint);
    margin: 36px 0 12px;
  }
  /* heatmap */
  .grid-wrap { overflow-x: auto; }
  table.heat {
    border-collapse: separate;
    border-spacing: 3px;
    width: 100%;
    min-width: 760px;
  }
  table.heat th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--faint);
    font-weight: 600;
    padding: 4px 6px;
    text-align: left;
  }
  table.heat td.section-name {
    white-space: nowrap;
    padding: 0 14px 0 6px;
    font-weight: 600;
    font-size: 14px;
  }
  table.heat td.section-name .done-tag {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--faint);
    font-family: var(--mono);
  }
  .cell {
    border-radius: 7px;
    padding: 7px 9px;
    font-size: 12px;
    font-family: var(--mono);
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .cell:hover, .cell:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .g-missing { background: rgba(255,111,103,0.16); color: var(--red); border-color: rgba(255,111,103,0.4); }
  .g-partial { background: rgba(232,182,74,0.12); color: var(--amber); border-color: rgba(232,182,74,0.3); }
  .g-solid   { background: rgba(74,222,128,0.10); color: var(--green); border-color: rgba(74,222,128,0.3); }
  .legend { display: flex; gap: 18px; margin-top: 10px; font-size: 12px; font-family: var(--mono); color: var(--dim); flex-wrap: wrap; }
  /* drill-down */
  details.section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
  }
  details.section > summary {
    cursor: pointer;
    padding: 13px 18px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    list-style: none;
    font-weight: 700;
    font-size: 16px;
  }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary::before { content: "▸"; color: var(--cyan); font-size: 13px; }
  details.section[open] > summary::before { content: "▾"; }
  summary .roots { font-family: var(--mono); font-size: 12px; color: var(--faint); font-weight: 400; }
  summary .done { margin-left: auto; font-family: var(--mono); font-size: 12px; }
  .done.d-partial { color: var(--amber); }
  .done.d-done { color: var(--green); }
  .done.d-not_done { color: var(--red); }
  .section-body { padding: 4px 18px 18px; border-top: 1px solid var(--border); }
  .dim-block { margin: 14px 0; }
  .dim-head {
    display: flex; gap: 10px; align-items: baseline;
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); font-weight: 600;
  }
  .dim-head .badge { font-family: var(--mono); text-transform: none; letter-spacing: 0; font-size: 12px; padding: 1px 8px; border-radius: 999px; }
  ul.evidence { margin: 6px 0 0; padding-left: 20px; }
  ul.evidence li { color: var(--dim); font-size: 13.5px; margin: 3px 0; }
  ul.evidence li code, .mono { font-family: var(--mono); font-size: 12.5px; color: var(--cyan); }
  .recs { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .rec { display: flex; gap: 10px; margin: 7px 0; font-size: 14px; align-items: baseline; }
  .prio { font-family: var(--mono); font-size: 11px; padding: 1px 8px; border-radius: 999px; flex: none; text-transform: uppercase; }
  .p-high { background: rgba(255,111,103,0.16); color: var(--red); }
  .p-med  { background: rgba(232,182,74,0.13); color: var(--amber); }
  .p-low  { background: rgba(93,102,130,0.25); color: var(--dim); }
  .rec .why { color: var(--faint); font-size: 13px; }
  /* cross-cutting */
  .cross { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px 18px 16px; }
  .cross h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--amber); margin: 14px 0 4px; }
  .cross ul { margin: 4px 0; padding-left: 20px; }
  .cross li { color: var(--dim); font-size: 14px; margin: 5px 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media (max-width: 640px) {
    body { font-size: 14px; }
    summary .done { margin-left: 0; }
  }
</style>

const DIMS = ["intent","decisions","language","implementation","verification","openItems","coherence"];
const DIM_LABELS = { intent:"Intent", decisions:"Decisions", language:"Language", implementation:"Implementation", verification:"Verification", openItems:"Open items", coherence:"Coherence" };
const GLYPH = { missing:"✗", partial:"◐", solid:"●" };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// wrap path:line pointers in <code>
const fmtEv = (s) => esc(s).replace(/([\w./-]+\.(?:py|md|ts|vue|yaml|json|db)(?::[\d,-]+)?)/g, "<code>$1</code>");

document.getElementById("meta").textContent =
  `generated ${data.generatedAt} · ${data.project.sectionCount} sections · snapshot — re-run to refresh`;
document.getElementById("summary").textContent = data.project.summary;

// heatmap
const heat = document.getElementById("heat");
let html = "<tr><th></th>" + DIMS.map(d => `<th>${DIM_LABELS[d]}</th>`).join("") + "</tr>";
for (const [si, sec] of data.sections.entries()) {
  html += `<tr><td class="section-name">${esc(sec.name)}<span class="done-tag">${sec.doneState.replace("_"," ")}</span></td>`;
  for (const d of DIMS) {
    const g = sec.grades[d];
    html += `<td><button class="cell g-${g}" data-target="sec-${si}" title="open drill-down">${GLYPH[g]} ${g}</button></td>`;
  }
  html += "</tr>";
}
heat.innerHTML = html;
heat.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-target]");
  if (!btn) return;
  const det = document.getElementById(btn.dataset.target);
  det.open = true;
  det.scrollIntoView({ block: "start", behavior: "smooth" });
});

// drill-down
const drill = document.getElementById("drill");
drill.innerHTML = data.sections.map((sec, si) => `
  <details class="section" id="sec-${si}"${si === 0 ? " open" : ""}>
    <summary>${esc(sec.name)}
      <span class="roots">${sec.evidenceRoots.map(esc).join(" · ")}</span>
      <span class="done d-${sec.doneState}">${sec.doneState.replace("_"," ")}</span>
    </summary>
    <div class="section-body">
      ${DIMS.map(d => `
        <div class="dim-block">
          <div class="dim-head">${DIM_LABELS[d]}
            <span class="badge g-${sec.grades[d]}">${GLYPH[sec.grades[d]]} ${sec.grades[d]}</span>
          </div>
          <ul class="evidence">${(sec.evidence[d] || []).map(e => `<li>${fmtEv(e)}</li>`).join("")}</ul>
        </div>`).join("")}
      <div class="recs">
        ${sec.recommendations.map(r => `
          <div class="rec"><span class="prio p-${r.priority}">${r.priority}</span>
            <span>${esc(r.action)}<br/><span class="why">${esc(r.why)}</span></span></div>`).join("")}
      </div>
    </div>
  </details>`).join("");

// cross-cutting
document.getElementById("cross").innerHTML = `
  <h3>Contradictions</h3>
  <ul>${data.crossCutting.contradictions.map(c => `<li>${fmtEv(c)}</li>`).join("")}</ul>
  <h3>Vocabulary drift</h3>
  <ul>${data.crossCutting.orphanedVocabulary.map(v => `<li>${fmtEv(v)}</li>`).join("")}</ul>`;
</script>
